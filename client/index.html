<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#edf0f3" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="مصروفي — مصروفات البيت والأسرة في مكان واحد" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>مصروفي</title>
    <script>
      // المظهر قبل ما React يحمّل، عشان الوضع الداكن ميبانش فاتح للحظة
      try {
        var pref = JSON.parse(localStorage.getItem('masrofy.theme') || '"auto"');
        var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { /* وضع خاص: نكمّل بالفاتح */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
